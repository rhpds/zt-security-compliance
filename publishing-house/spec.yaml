project:
  slug: "zt-security-compliance"
  owner_email: "jloscar@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "new"
  automation_type: "ansible"
  description: "This lab introduces you to automated Linux security compliance through practical, real-world scenario management. Working across two Linux machines, students learn how enterprise organizations measure security health, apply automated fixes, manage policy exceptions, and prevent security drift on fresh deployments.  The lab begins on Box 1 with an initial security audit using OpenSCAP to evaluate an out-of-the-box system and interpret the resulting compliance report. Students then execute automated remediation commands to lock down the system to CIS Level 1 (essential security) and run a follow-up scan to verify that all non-compliant settings pass.  To explore more advanced security models, the lab transitions to Box 2 to run a CIS Level 2 audit, illustrating the difference between standard operational hardening and maximum-security lockdown. Students then practice managing real-world operational exceptions by using autotailor to create custom rule overrides without altering vendor source files. Finally, the lab covers proactive defense by using Red Hat Image Builder to bake compliance profiles directly into OS blueprints, ensuring newly created virtual machines are secure from day one."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1649"
  workflow_id: "0a5a9402-24a9-4ad3-9d15-b9c1f64b61df"

spec:
  title: "Automated Linux Security Compliance & Hardening"
  learning_objectives:
  - "Analyze a system's security posture by running an OpenSCAP audit against the CIS Level 1 - Server profile and interpreting the HTML compliance report."
  - "Secure a live RHEL system by executing automated OpenSCAP remediation and verifying that target controls change from Fail to Pass."
  - "Analyze the differences between CIS Level 1 and CIS Level 2 profiles and identify the rule adjustments required for alternate frameworks such as PCI-DSS and DISA STIG."
  - "Configure a custom tailoring profile with autotailor to override specific rules without editing vendor source content."
  - "Build a pre-hardened RHEL image with Red Hat Image Builder by embedding OpenSCAP directives into a blueprint."
  modules:                 # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
  - id: module-01
    title: "Baseline Assessment (Box 1)"
    duration_min: 7
    status: not_started
  - id: module-02
    title: "Live System Remediation & Verification (Box 1)"
    duration_min: 6
    status: not_started
  - id: module-03
    title: "Advanced Security Standards & Scenarios (Box 2)"
    duration_min: 8
    status: not_started
  - id: module-04
    title: "Policy Customization & Exception Handling (Box 2)"
    duration_min: 7
    status: not_started
  - id: module-05
    title: "Proactive Compliance with Image Builder (Box 2)"
    duration_min: 8
    status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | azure | aro | rosa | google | gcp — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 0.67
  audience: "beginner"       # beginner | intermediate | advanced

