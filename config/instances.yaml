---
virtualmachines:
  - name: "rhel"
    image: "rhel-10-1-04-15-26"
    bootloader: efi
    memory: "4G"
    cores: 1
    image_size: "40G"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    packages:
      - openscap-scanner
      - scap-security-guide
      - openscap-utils
  - name: "node1"
    image: "rhel-10-1-04-15-26"
    bootloader: efi
    memory: "8G"
    cores: 2
    image_size: "40G"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    packages:
      - openscap-scanner
      - scap-security-guide
      - openscap-utils
      - osbuild-composer
      - composer-cli
