---
# Run on fresh QA instances only: Module 4 applies CIS remediation without rollback.
- ansible.builtin.import_playbook: healthcheck.yml

- name: Verify every compliance module in learner order
  hosts: qa_bastions
  gather_facts: false
  become: true
  tasks:
    - name: Run all modules in one root session because CIS changes sudo
      ansible.builtin.shell: |
        set -euo pipefail
        work=$(mktemp -d)
        trap 'rm -rf -- "$work"' EXIT
        cd "$work"
        ds=/usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml
        profile=xccdf_org.ssgproject.content_profile_cis_server_l1

        scan() {
          local name=$1 rc=0
          shift
          oscap xccdf eval --profile "$profile" --results "$name.xml" --report "$name.html" "$@" "$ds" >/dev/null || rc=$?
          if [[ $rc != 0 && $rc != 2 ]]; then
            echo "OpenSCAP $name failed (rc=$rc)" >&2
            return "$rc"
          fi
          test -s "$name.html"
          grep -q '<rule-result' "$name.xml"
        }

        # 1: install tools and check the expected profiles exist.
        dnf -y install openscap-scanner scap-security-guide openscap-utils
        oscap --version
        oscap info "$ds" > profiles
        grep -Eq "Id:[[:space:]]+$profile$" profiles
        grep -Eq 'Id:[[:space:]]+xccdf_org.ssgproject.content_profile_cis$' profiles

        # 2: documentation-only walkthrough; errata metadata is not required.
        echo "Module 2: advisory and patch commands are read-only examples and are not run."

        # 3–4: measure, remediate, and measure again.
        scan before
        scan remediation --remediate
        scan after
        before=$(grep -c '<result>fail</result>' before.xml || :)
        after=$(grep -c '<result>fail</result>' after.xml || :)
        echo "CIS L1 failures: $before before, $after after"
        (( before > after ))

        # Follow the bastion-to-node1 hop after hardening the bastion.
        runuser -u rhel -- ssh -T -o BatchMode=yes -o ConnectTimeout=8 node1 'sudo -n /bin/bash -s' <<'NODE1_QA'
          set -euo pipefail
          test "$(hostname -s)" = node1
          work=$(mktemp -d)
          blueprint="lb2081-qa-$(basename "$work" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
          compose_id=''
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$compose_id" ]]; then
              composer-cli compose cancel "$compose_id" >/dev/null 2>&1 || :
              composer-cli compose delete "$compose_id" >/dev/null 2>&1 || :
            fi
            if [[ -f blueprint.toml ]]; then
              composer-cli blueprints delete "$blueprint" >/dev/null 2>&1 || :
            fi
            rm -rf -- "$work"
            exit "$status"
          }
          trap cleanup EXIT
          cd "$work"
          ds=/usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml
          l1=xccdf_org.ssgproject.content_profile_cis_server_l1
          l2=xccdf_org.ssgproject.content_profile_cis
          custom=${l1}_qa_custom
          exception=xccdf_org.ssgproject.content_rule_accounts_tmout
          dnf -y install openscap-scanner scap-security-guide openscap-utils

          scan() {
            local name=$1 profile=$2 rc=0
            shift 2
            oscap xccdf eval --profile "$profile" --results "$name.xml" --report "$name.html" "$@" "$ds" >/dev/null || rc=$?
            if [[ $rc != 0 && $rc != 2 ]]; then
              echo "OpenSCAP $name failed (rc=$rc)" >&2
              return "$rc"
            fi
            test -s "$name.html"
            grep -q '<rule-result' "$name.xml"
          }
          # 5: both profiles must run correctly; rule-count ordering may vary.
          scan l1 "$l1"
          scan l2 "$l2"

          # 6: tailor the profile without editing the upstream datastream.
          sha256sum "$ds" > original.sha
          autotailor --output tailoring.xml --new-profile-id "$custom" --title 'QA custom CIS L1' --unselect "$exception" "$ds" "$l1"
          grep -F "$exception" tailoring.xml | grep -Eq 'selected="false"'
          scan tailored "$custom" --tailoring-file tailoring.xml
          sha256sum -c original.sha
          python3 - "$l1" "$l2" "$custom" "$exception" <<'CHECK_XCCDF'
        import sys
        from xml.etree import ElementTree as ET

        for name, expected in zip(("l1", "l2", "tailored"), sys.argv[1:4]):
            root = ET.parse(f"{name}.xml").getroot()
            results = root.findall(".//{*}TestResult")
            if len(results) != 1:
                sys.exit(f"{name}: expected one XCCDF TestResult")
            profile = results[0].find("{*}profile")
            if profile is None or profile.get("idref") != expected:
                sys.exit(f"{name}: expected profile {expected}")
            rules = results[0].findall("{*}rule-result")
            evaluated = sum(rule.findtext("{*}result") in {"pass", "fail", "error", "unknown", "fixed"}
                            for rule in rules)
            if not evaluated:
                sys.exit(f"{name}: profile evaluated no rules")
            print(f"{name}: {evaluated} evaluated rules")
            if name == "tailored":
                exception = sys.argv[4]
                for rule in rules:
                    if rule.get("idref") == exception and rule.findtext("{*}result") != "notselected":
                        sys.exit(f"{name}: waived rule {exception} was not excluded")
        CHECK_XCCDF

          # 7: depsolve and queue the documented qcow2 build; the lab does not wait for completion.
          dnf -y install composer-cli osbuild-composer
          systemctl enable --now osbuild-composer.socket
          test -S /run/weldr/api.socket
          printf '%s\n' "name = \"$blueprint\"" 'description = "QA CIS L1 blueprint"' 'version = "0.0.1"' 'distro = "rhel-10.1"' '' '[customizations.openscap]' "datastream = \"$ds\"" "profile_id = \"$l1\"" > blueprint.toml
          composer-cli blueprints push blueprint.toml
          composer-cli blueprints show "$blueprint" > shown.toml
          grep -Fq "$l1" shown.toml
          composer-cli blueprints depsolve "$blueprint"
          start=$(composer-cli compose start "$blueprint" qcow2)
          echo "$start"
          compose_id=$(grep -Eo '[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}' <<< "$start" | head -1)
          test -n "$compose_id"
          for attempt in {1..12}; do
            status=$(composer-cli compose status)
            line=$(grep -F "$compose_id" <<< "$status" || :)
            if [[ $line =~ FAILED ]]; then echo "$line" >&2; exit 1; fi
            if [[ $line =~ (WAITING|RUNNING|FINISHED) ]]; then echo "$line"; exit 0; fi
            sleep 5
          done
          echo "Image Builder did not report compose $compose_id in an expected state" >&2
          exit 1
        NODE1_QA
      args:
        executable: /bin/bash
