---
- ansible.builtin.import_playbook: inventory.yml

- name: Verify the learner can reach both RHEL VMs and use Satellite repositories
  hosts: qa_bastions
  gather_facts: false
  tasks:
    - name: Check learner access and repository configuration on the bastion
      ansible.builtin.command: sudo -n dnf -q repolist --enabled
      register: bastion_repos
      changed_when: false

    - name: Check node1 identity, learner sudo, repositories and Image Builder configuration
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, ConnectTimeout=8, node1, "hostname -s && rpm -E '%{rhel}' && sudo -n dnf -q repolist --enabled && sudo -n test -s /etc/osbuild-composer/repositories/rhel-10.1.json"]
      register: node
      changed_when: false

    - name: Check the primary VM release
      ansible.builtin.command: rpm -E '%{rhel}'
      register: bastion_release
      changed_when: false

    - name: Require two usable RHEL 10 systems
      ansible.builtin.assert:
        that:
          - bastion_release.stdout | trim == '10'
          - node.stdout_lines[:2] == ['node1', '10']
          - bastion_repos.stdout_lines | length > 1
          - node.stdout_lines | length > 3

    - name: Resolve OpenSCAP packages through the bastion's configured package sources
      ansible.builtin.command:
        argv: [timeout, "20", sudo, -n, dnf, -q, repoquery, --queryformat, '%{name}', openscap-scanner, scap-security-guide, openscap-utils]
      register: bastion_packages
      changed_when: false

    - name: Resolve OpenSCAP and Image Builder packages through node1's configured package sources
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=8
          - node1
          - >-
            timeout 20 sudo -n dnf -q repoquery --queryformat '%{name}'
            openscap-scanner scap-security-guide openscap-utils composer-cli osbuild-composer
      register: node_packages
      changed_when: false

    - name: Require every package that the learner installs
      ansible.builtin.assert:
        that:
          - "['openscap-scanner', 'scap-security-guide', 'openscap-utils'] | difference(bastion_packages.stdout_lines) | length == 0"
          - "['openscap-scanner', 'scap-security-guide', 'openscap-utils', 'composer-cli', 'osbuild-composer'] | difference(node_packages.stdout_lines) | length == 0"
        fail_msg: The enabled repositories did not resolve all required lab packages.
